name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: make check
      - run: make cover
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Report the version this merge would produce
        run: go run ./cmd/kirobuff version next
